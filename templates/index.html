<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R15 AI</title>
<style>
:root{--bg:#07111c;--panel:rgba(13,25,41,.88);--line:rgba(255,255,255,.1);--text:#eef7ff;--muted:#91a6ba;--a:#55d6ff;--b:#8d72ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Inter,system-ui,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,#12435a55,transparent 30%),radial-gradient(circle at 90% 90%,#44317a55,transparent 30%),var(--bg)}
.app{width:min(960px,100%);height:min(760px,94vh);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:var(--panel);backdrop-filter:blur(20px);box-shadow:0 30px 80px #0008}
header{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:13px}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,var(--a),var(--b));color:#06111b;font-weight:900;font-size:20px}h1{font-size:1.2rem;margin:0}.sub{font-size:.82rem;color:var(--muted);margin-top:4px}.mode{font-size:.78rem;color:#a9bfd1}.mode span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#63e6a4;box-shadow:0 0 12px #63e6a4;margin-right:7px}
#chat{padding:28px;overflow:auto;display:flex;flex-direction:column;gap:15px}.welcome{margin:auto;text-align:center;max-width:600px}.welcome h2{font-size:2rem;margin:0 0 10px}.welcome p{color:var(--muted);line-height:1.6}.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:20px}.chip{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:#ffffff08;color:#cce4f7;cursor:pointer}
.msg{max-width:78%;padding:14px 16px;border:1px solid var(--line);border-radius:18px;line-height:1.55;white-space:pre-wrap}.user{align-self:flex-end;background:#143552;border-bottom-right-radius:5px}.bot{align-self:flex-start;background:#102239;border-bottom-left-radius:5px}
footer{padding:17px 21px 21px;border-top:1px solid var(--line)}form{display:flex;gap:9px;padding:7px;border:1px solid var(--line);border-radius:18px;background:#0003}textarea{flex:1;resize:none;min-height:48px;max-height:130px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:13px}button[type=submit]{width:52px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));font-size:19px;cursor:pointer}button:disabled{opacity:.5}
@media(max-width:650px){body{padding:0}.app{height:100vh;border-radius:0}header{padding:17px}.mode{display:none}#chat{padding:18px}.msg{max-width:90%}footer{padding:12px}}
</style>
</head>
<body>
<main class="app">
<header>
<div class="brand"><div class="logo">R</div><div><h1>R15 AI</h1><div class="sub">Focused study assistant for R15 learners</div></div></div>
<div class="mode"><span></span>Study mode</div>
</header>
<section id="chat">
<div class="welcome" id="welcome">
<h2>Learn. Revise. Master.</h2>
<p>Ask academic questions, request explanations, practice problems, summaries, or study guidance.</p>
<div class="chips">
<button class="chip" data-q="Explain a difficult engineering concept simply">Explain a concept</button>
<button class="chip" data-q="Create a revision plan for my exams">Revision plan</button>
<button class="chip" data-q="Give me five practice questions on a topic">Practice questions</button>
</div>
</div>
</section>
<footer><form id="form"><textarea id="input" placeholder="Ask a study question..." aria-label="Study question"></textarea><button type="submit">➤</button></form></footer>
</main>
<script>
const chat=document.getElementById("chat"),form=document.getElementById("form"),input=document.getElementById("input");
function add(text,kind){document.getElementById("welcome")?.remove();const el=document.createElement("div");el.className=`msg ${kind}`;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{input.value=b.dataset.q;input.focus()});
form.onsubmit=async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;add(message,"user");input.value="";const send=form.querySelector("button");send.disabled=true;const reply=add("Thinking…","bot");
try{const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});const d=await r.json();reply.textContent=d.answer||d.error||"Something went wrong."}catch{reply.textContent="Unable to connect to R15 AI right now."}finally{send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight}};
input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}};
</script>
</body>
</html>
